services:
  web:
    build: .
    image: doc-analyzer:latest
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      PORT: "5000"
      DATABASE: /data/documents.db
      UPLOAD_FOLDER: /data/uploads
      FLASK_DEBUG: "0"
    volumes:
      - doc-data:/data
    restart: unless-stopped

volumes:
  doc-data:
