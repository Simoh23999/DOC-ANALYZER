name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, dev]

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node for Prettier
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python linters
        run: pip install ruff black


      - name: Ruff check
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: ruff check .

      - name: Black check
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: black --check .

      - name: Prettier check
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: npx --yes prettier --check "templates/**/*.html"


      - name: Ruff fix
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: ruff check --fix . || true

      - name: Black fix
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: black . || true

      - name: Prettier fix
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npx --yes prettier --write "templates/**/*.html" || true

      - name: Commit auto-fixes
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix lint/format [skip ci]"
          file_pattern: "app.py analyzer.py templates/ requirements.txt"

  docker:
    name: Build and push to GHCR
    needs: lint
    
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
